# Opens pull requests when GitHub Actions, the test tooling or numpy have updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
